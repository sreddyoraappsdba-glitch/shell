- name: print facts
  hosts: local
  connection: local
  tasks:
  - name: print facts
    debug:
      msg: "{{ ansible_facts }}"

  - name: print specific info 
    debug:
      msg: |
        OS Family: {{ ansible_facts['os_family']}}
        private_ip: {{ ansible_facts.default_ipv4.address }}
        private_ip: {{ ansible_facts['default_ipv4']['address'] }}