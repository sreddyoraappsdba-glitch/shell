- name: print os is redhat or debian 
  hosts: local
  become: yes 
  connection: local 
  tasks:
  - name: install nginx
    dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "RedHat"

  - name: install nginx
    dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "debian"
    