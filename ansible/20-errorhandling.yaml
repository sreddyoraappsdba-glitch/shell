- name: create roboshop user
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: check roboshop user exist or noquota
    command: id roboshop # linux command if ansible module doesnot exist
    register: user_output
    ignore_errors: true


  - name: print the output 
    debug:
      msg: " {{ user_output }}"

  - name: create the user
    command: useradd roboshop
    when: user_output.rc != 0
